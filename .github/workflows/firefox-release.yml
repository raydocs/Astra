name: Firefox Release

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign and submit to AMO"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build Firefox extension
        run: pnpm build:firefox

      - name: Lint Firefox extension
        run: npx web-ext lint --source-dir .output/firefox-mv3

      - name: Package Firefox extension
        run: pnpm zip:firefox

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-firefox-xpi
          path: .output/*.zip
          retention-days: 30

      - name: Sign and submit to AMO
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event.inputs.sign == 'true'
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$AMO_API_KEY" ] || [ -z "$AMO_API_SECRET" ]; then
            echo "AMO credentials not configured — skipping AMO submission"
            exit 0
          fi
          npx web-ext sign \
            --source-dir .output/firefox-mv3 \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --channel listed
