name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Zod entrypoints
        run: pnpm check:zod-entrypoints

      - name: Lint
        run: pnpm lint:ci

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Bench
        run: pnpm bench

  live-browser:
    needs: quality
    runs-on: ubuntu-latest
    env:
      ASTRA_BENCH_LIVE_USE_GOOGLE_CHROME: "1"
      DBUS_SESSION_BUS_ADDRESS: /dev/null

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (with system deps for Linux)
        run: npx playwright install --with-deps chromium chrome

      - name: Build Chrome extension
        run: pnpm build

      - name: Run required live lane (source-core)
        run: xvfb-run -a pnpm bench:live:lane:source-core

      - name: Run required live lane (extension-core)
        run: xvfb-run -a pnpm bench:live:lane:extension-core

      - name: Publish live gate summary
        if: always()
        run: |
          echo "## Required live release-proof lanes" >> $GITHUB_STEP_SUMMARY
          echo "- source-core: bench-live/page-translation-article-basic-source-bilingual, bench-live/article-extraction-proof, bench-live/dynamic-content-append" >> $GITHUB_STEP_SUMMARY
          echo "- extension-core: bench-live/site-automation-autostart, bench-live/onboarding-smoke, bench-live/vocabulary-srs-smoke" >> $GITHUB_STEP_SUMMARY
          if [ -f bench-live-results/latest.result.md ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Last scenario result (latest.result.md)" >> $GITHUB_STEP_SUMMARY
            sed -n '1,80p' bench-live-results/latest.result.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload live bench results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-bench-results
          path: bench-live-results/
          retention-days: 14

  build-extension:
    needs:
      - quality
      - live-browser
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, safari]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension (${{ matrix.browser }})
        run: |
          if [ "${{ matrix.browser }}" = "chrome" ]; then
            pnpm build
          elif [ "${{ matrix.browser }}" = "firefox" ]; then
            pnpm build:firefox
          elif [ "${{ matrix.browser }}" = "safari" ]; then
            pnpm build:safari
          fi

      - name: Verify Safari bundle sync
        if: matrix.browser == 'safari'
        run: bash ios/scripts/verify-safari-build-sync.sh

      - name: Lint Firefox extension
        if: matrix.browser == 'firefox'
        run: pnpm verify:firefox-lint -- .output/firefox-mv3

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: astra-${{ matrix.browser }}
          path: .output/${{ matrix.browser == 'chrome' && 'chrome-mv3' || matrix.browser == 'firefox' && 'firefox-mv3' || 'safari-mv3' }}
          retention-days: 14
