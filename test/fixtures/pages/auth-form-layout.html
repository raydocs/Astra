<main class="auth-shell">
  <section aria-label="Sign in panel">
    <h1>Sign in to Astra Cloud</h1>
    <p>
      Use your workspace email to sync provider presets, review saved prompts, and access beta
      features across desktop and mobile browsers.
    </p>

    <form>
      <label>
        Email
        <input type="email" name="email" />
      </label>
      <label>
        Password
        <input type="password" name="password" />
      </label>
      <button type="submit">Continue</button>
    </form>
  </section>

  <aside>
    <h2>Need help?</h2>
    <p>Reset your password, review privacy settings, or contact support.</p>
  </aside>
</main>
